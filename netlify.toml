# Netlify config for the Pocket Trainer landing site (static, no build step).
[build]
  publish = "site"
  command = ""

# Security + caching headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Optional: proxy the waitlist to your deployed backend so the form can POST to
# a same-origin /api path (keeps WAITLIST_ENDPOINT = "/api/waitlist").
# Replace the target with your backend URL and uncomment.
# [[redirects]]
#   from = "/api/*"
#   to = "https://api.pockettrainer.app/api/:splat"
#   status = 200
#   force = true
