# One-click deploy for the Pocket Trainer AI backend (brings the coach online).
#
# Deploy: in the Render dashboard, New > Blueprint, point it at this repo.
# Render builds the server, then you set the ANTHROPIC_API_KEY secret once.
# (Free web services sleep when idle — the first request after a nap is slow.)
services:
  - type: web
    name: pocket-trainer-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      # Your Anthropic key — set in the dashboard (kept secret, not in git).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      # Origins allowed to call the API. Add wherever the app is served from:
      #   - GitHub Pages:    https://a-train7171.github.io
      #   - Capacitor app:   https://localhost
      - key: CORS_ORIGINS
        value: https://a-train7171.github.io,https://localhost,http://localhost
      # Persist waitlist signups to a mounted disk path (optional).
      - key: WAITLIST_FILE
        value: /tmp/waitlist.jsonl
