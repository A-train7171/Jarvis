name: Deploy app to GitHub Pages

# Builds the Vite app and publishes it to GitHub Pages so there's a real,
# tappable URL. The app runs standalone (AI features use offline fallbacks
# until the backend is also deployed and VITE_API_BASE is set).

on:
  push:
    branches: ["claude/pocket-trainer-production-5majaj"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          # Project site is served under /<repo>/ — repo is "jarvis".
          VITE_BASE: /jarvis/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
